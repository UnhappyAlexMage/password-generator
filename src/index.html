<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Generate passwords</title>
    </head>
    <body>

        <h2>PASSWORD GENERATOR</h2>
        <span id="resultPassword"></span>
        <label>Length: 
            <input 
                id="length" 
                type="number" 
                value="10" 
                min="5" 
                max="20" 
            />
        </label>
        <label>Include Lowercase Letters (a-z)
            <input 
                data-type="lowercase"
                type="checkbox" 
                checked 
            />
        </label>
        <label>Include Uppercase Letters (A-Z)
            <input 
                data-type="uppercase"
                type="checkbox" 
                checked 
            />
        </label>
        <label>Include Numbers (0-9)
            <input 
                data-type="numbers"
                type="checkbox" 
                checked 
            />
        </label>
        <label>Include Symbols (!@#$%^&*()-+)
            <input 
                data-type="symbols"
                type="checkbox" 
                checked 
            />
        </label>
        <button id="generate-btn">Generate Password</button>

        <script src="/src/index.js" defer></script>
    </body>
</html>
