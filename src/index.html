<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link rel="stylesheet" href="./global.css" />
        <title>Generate passwords</title>
    </head>
    <body>
        <div class="generator-card">
            <h2>PASSWORD GENERATOR</h2>
            <div class="password-length">
                <label for="passwordLength">Длина вашего пароля - <span id="lengthValue">20</span> символов:</label>
                <input id="passwordLength" type="range" min="1" max="40" value="20">
            </div>
            <div class="setting-item">
                <label>Include Lowercase Letters (a-z)
                    <input 
                        data-type="lowercase"
                        type="checkbox" 
                        checked 
                    />
                </label>
                <label>Include Uppercase Letters (A-Z)
                    <input 
                        data-type="uppercase"
                        type="checkbox" 
                        checked 
                    />
                </label>
                <label>Include Numbers (0-9)
                    <input 
                        data-type="numbers"
                        type="checkbox" 
                        checked 
                    />
                </label>
                <label>Include Symbols (!@#$%^&*()-+)
                    <input 
                        data-type="symbols"
                        type="checkbox" 
                        checked 
                    />
                </label>
            </div>
            <button id="generate-btn">Generate Password</button>
            <div class="result-container">
                <input 
                    type="text" 
                    id="passwordResult" 
                    placeholder="Ваш пароль" 
                    readonly 
                    onclick="if(this.value) { this.select(); navigator.clipboard.writeText(this.value); }"
                >
            </div>
        </div>
        <script type="module" src="/src/index.js"></script>
    </body>
</html>
